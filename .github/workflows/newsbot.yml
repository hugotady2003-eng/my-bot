name: NewsBot – Email

on:
  schedule:
    - cron: "0 6,8,10,12,14,16,18,20,21 * * *"
  workflow_dispatch:
  repository_dispatch:
    types: [run-bot]

concurrency:
  group: pulse-bot-run
  cancel-in-progress: false


jobs:
  run-bot:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installation
        run: pip install -r requirements.txt

      - name: Cache articles vus
        uses: actions/cache@v4
        with:
          path: seen_articles.db
          key: seen-${{ github.run_id }}
          restore-keys: seen-

      - name: Lancer le bot
        env:
          GMAIL_ADDRESS:               ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASS:              ${{ secrets.GMAIL_APP_PASS }}
          EMAIL_TO:                    ${{ secrets.EMAIL_TO }}
          ANTHROPIC_API_KEY:           ${{ secrets.ANTHROPIC_API_KEY }}
          YOUTUBE_API_KEY:             ${{ secrets.YOUTUBE_API_KEY }}
          TWITTER_API_KEY:             ${{ secrets.TWITTER_API_KEY }}
          TWITTER_API_SECRET:          ${{ secrets.TWITTER_API_SECRET }}
          TWITTER_ACCESS_TOKEN:        ${{ secrets.TWITTER_ACCESS_TOKEN }}
          TWITTER_ACCESS_TOKEN_SECRET: ${{ secrets.TWITTER_ACCESS_TOKEN_SECRET }}
          FACEBOOK_PAGE_TOKEN: ${{ secrets.FACEBOOK_PAGE_TOKEN }}
          FACEBOOK_PAGE_ID:    ${{ secrets.FACEBOOK_PAGE_ID }}
          INSTAGRAM_ACCOUNT_ID: ${{ secrets.INSTAGRAM_ACCOUNT_ID }}
          IMGBB_KEY:            ${{ secrets.IMGBB_KEY }}
          FOOTBALL_DATA_TOKEN: ${{ secrets.FOOTBALL_DATA_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          LLM_ANALYSE: gemini
        run: python bot_single_run.py

      - name: Garder le repo actif (évite la désactivation du cron)
        run: |
          git config user.email "pulse-bot@github.com"
          git config user.name "Pulse Bot"
          echo "Dernier run : $(date)" > last_run.txt
          git add last_run.txt
          git commit -m "bot: run $(date '+%Y-%m-%d %H:%M')" || echo "Rien à commiter"
          git push || echo "Push échoué"
